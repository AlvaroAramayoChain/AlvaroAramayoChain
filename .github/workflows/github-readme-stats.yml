name: Generate GitHub Stats Image

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-readme-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: AlvaroAramayoChain/github-readme-stats-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
